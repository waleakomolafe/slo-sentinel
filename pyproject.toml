[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slo-sentinel"
version = "0.1.0"
description = "Generates multiwindow multi-burn Prometheus error-budget alerts from a small SLO spec."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wale Akomolafe" }]
keywords = ["slo", "sre", "prometheus", "error-budget", "alerting"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
slo-sentinel = "slo_sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["slo_sentinel*"]
