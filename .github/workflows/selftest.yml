name: selftest

on:
  push:
  pull_request:
  schedule:
    - cron: "31 4 * * 1"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Generate rules from this repo's own examples
        run: slo-sentinel examples/checkout_api.yaml examples/kafka_consumer.yaml -o generated/
      - name: promtool check and unit-test the generated rules
        run: |
          curl -sSL -o prom.tgz "https://github.com/prometheus/prometheus/releases/download/v3.15.1/prometheus-3.15.1.linux-amd64.tar.gz"
          tar xzf prom.tgz
          prometheus-3.15.1.linux-amd64/promtool check rules generated/*.yaml
          prometheus-3.15.1.linux-amd64/promtool test rules tests/promtool_tests.yml
      - name: Audit this repo's workflows with pipeline-sentinel
        run: |
          pip install git+https://github.com/waleakomolafe/pipeline-sentinel
          pipeline-sentinel .
